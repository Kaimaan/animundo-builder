name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The world revision the compat check runs against (#160.4).
      # Bump with the world when it moves; the revision step below
      # prints the exact commit every run tested.
      WORLD_REV: 637e742ebfdf2c5b9ed06ae5871cd7996ad170e6
      ANIMUNDO_WORLD: ${{ github.workspace }}/animundo-world
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Kaimaan/animundo-world
          ref: ${{ env.WORLD_REV }}
          path: animundo-world
      - run: git -C animundo-world rev-parse HEAD
        name: Identify the world revision
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - uses: gitleaks/gitleaks-action@v2

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: firebase
      - run: npm test
        working-directory: firebase
