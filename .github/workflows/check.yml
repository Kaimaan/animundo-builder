name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - uses: gitleaks/gitleaks-action@v2

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: firebase
      - run: npm test
        working-directory: firebase

  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-headless
      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSfL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Run the addon checks
        run: |
          rm -rf /tmp/addon-check && mkdir -p /tmp/addon-check
          cp -r godot/addons /tmp/addon-check/addons
          printf '[application]\nconfig/name="Addon checks"\n' > /tmp/addon-check/project.godot
          ~/godot/godot --headless --path /tmp/addon-check --import >/dev/null 2>&1 || true
          ~/godot/godot --headless --path /tmp/addon-check --script \
            res://addons/animundo_builder/tests/check_draft_opener.gd
          ~/godot/godot --headless --path /tmp/addon-check --script \
            res://addons/animundo_builder/tests/check_content_packs.gd
          ~/godot/godot --headless --path /tmp/addon-check --script \
            res://addons/animundo_builder/tests/check_home_pack.gd
