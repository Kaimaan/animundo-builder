name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The world revision the compat check runs against (#160.4).
      # Bump with the world when it moves; the revision step below
      # prints the exact commit every run tested.
      WORLD_REV: 2178899f832163e2a2e37e11477434ea2f313161
      ANIMUNDO_WORLD: ${{ github.workspace }}/../animundo-world
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Kaimaan/animundo-world
          ref: ${{ env.WORLD_REV }}
          path: world-staging
      # The tests look for the world next to the checkout, as
      # scripts/get-world lays it out; a child only feeds the
      # compat check while ~110 world tests skip (#260.1).
      - run: mv world-staging ../animundo-world
        name: Lay the world out as a sibling of the workspace
      - run: git -C ../animundo-world rev-parse HEAD
        name: Identify the world revision
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - uses: gitleaks/gitleaks-action@v2

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: firebase
      - run: npm test
        working-directory: firebase
