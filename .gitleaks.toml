# The builder web app ships Firebase's public web key (the same one
# the game ships openly in its own config): Firebase web keys are
# restricted by domain in Google Cloud, not by secrecy. This allows
# exactly that key, only in the web app. The pattern holds a prefix
# on purpose: the full key here would flag this file itself.
[allowlist]
description = "Firebase public web key in the builder web app"
paths = ['''web/build/app\.js''']
regexes = ['''AIzaSyAXX6Gz5aN5QQ2txF''']
