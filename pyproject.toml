[project]
name = "animundo-builder"
version = "0.1.0"
description = "Open-source agents that build real places into the Animundo nature game"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kai Lemmetty" }]
dependencies = [
    "openai>=1.50",
    "httpx2>=2",
    "jsonschema>=4.20",
    "pillow>=13.0.0",
    "numpy>=2.5.4",
]

[project.scripts]
builder = "builder.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
