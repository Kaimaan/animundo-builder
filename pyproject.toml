[project]
name = "animundo-builder"
version = "0.1.0"
description = "Agents that build real places into the Animundo nature game"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kai Lemmetty" }]
dependencies = [
    "openai>=1.50",
    "httpx2>=2",
    "jsonschema>=4.20",
    "referencing>=0.30",
    "pillow>=13.0.0",
    "numpy>=2.5.4",
    "firebase-admin>=7.7.0",
    "python-dotenv>=1.2.4",
    "pydantic>=2",
    "pyproj>=3.6",
    "fiona>=1.10",
    "shapely>=2.0",
    "rasterio>=1.4",
    "modal>=1.6.3",
]

[project.scripts]
builder = "builder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
# CI clones animundo-world inside the workspace; it is a separate
# repository with its own style, never linted from here (#215).
exclude = ["animundo-world"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
