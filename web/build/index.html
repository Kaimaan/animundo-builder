<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your animals · Animundo</title>
<meta name="theme-color" content="#1d2a22">
<link rel="icon" href="icon_192.png">
<link rel="stylesheet" href="styles.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
</head>
<body>
<header>
  <div class="top">
    <a class="brand" href="/"><img src="icon_192.png" alt="" width="44" height="44" onerror="this.remove()">ANIMUNDO</a>
    <div class="header-right">
      <div id="auth-signed-out">
        <input id="auth-email" type="email" data-i18n-ph="auth.email_ph" placeholder="grown-up@example.org" autocomplete="email">
        <button id="auth-send" type="button" data-i18n="auth.send">Send sign-in link</button>
        <button id="auth-test" type="button" data-i18n="auth.test" hidden>Use the test grown-up</button>
        <p id="auth-note" class="muted" data-i18n="auth.note">Grown-ups only: sign in with an email link.</p>
        <div id="auth-judge" hidden>
          <p class="muted" data-i18n="auth.judge_line">Judges: sign in with the account from the instructions</p>
          <input id="auth-judge-email" type="email" data-i18n-ph="auth.email_ph" placeholder="grown-up@example.org" autocomplete="username">
          <input id="auth-judge-password" type="password" data-i18n-ph="auth.judge_password_ph" placeholder="Password" autocomplete="current-password">
          <button id="auth-judge-signin" type="button" data-i18n="auth.judge_signin">Sign in</button>
          <p id="auth-judge-error" class="error" hidden></p>
        </div>
      </div>
      <div id="auth-signed-in" hidden>
        <span id="auth-who"></span>
        <button id="auth-out" type="button" data-i18n="auth.out">Sign out</button>
      </div>
    </div>
  </div>
</header>
<p id="app-error" class="error" hidden></p>

<main id="app" hidden>
  <section class="side-pane" id="animals-pane">
    <h2 data-i18n="animals.title">Your animals</h2>
    <div id="animal-list"></div>
  </section>

  <section class="side-pane" id="new-pane" hidden>
    <p><button id="back-animals" type="button" class="ghost" data-i18n="animals.back">Your animals</button></p>
    <article id="animal-picker">
      <h2 data-i18n="home.ask">Which animal would you like to be?</h2>
      <input id="animal-q" type="text" data-i18n-ph="home.ask_ph" placeholder="Type an animal…" autocomplete="off">
      <div id="animal-suggest"></div>
      <p id="animal-msg" class="muted"></p>
    </article>

    <article id="place-picker" hidden>
      <h2><span data-i18n="place.near">Places near</span> <select id="place-country" aria-label="Country"></select></h2>
      <div id="place-cards"></div>
      <h3 data-i18n="place.search_more">Search more places</h3>
      <input id="place-q" type="text" data-i18n-ph="place.search_ph" placeholder="Type a place…" autocomplete="off">
      <div id="place-search"></div>
      <p id="place-msg" class="muted"></p>
    </article>

    <article id="picked-card" hidden>
      <h2 id="picked-name"></h2>
      <p id="picked-facts" class="muted"></p>
      <p id="picked-state"></p>
      <button id="picked-make" type="button" data-i18n="home.make">Make this home</button>
      <button id="picked-play" type="button" data-i18n="draft.play" hidden>Play in the game</button>
      <p id="picked-msg" class="muted"></p>
    </article>
  </section>
</main>

<footer>
  <span data-i18n="app.credit">Places: Wikidata and GBIF.org.</span>
  <a href="/" data-i18n="app.play">Play Animundo</a>
</footer>
<script src="app.js"></script>
</body>
</html>
