<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build the world · Animundo</title>
<meta name="theme-color" content="#1d2a22">
<link rel="icon" href="/icon_192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
</head>
<body>
<header>
  <div class="top">
    <a class="brand" href="/"><img src="/icon_192.png" alt="" width="44" height="44" onerror="this.remove()">ANIMUNDO</a>
    <div class="header-right">
      <div class="langs" role="group" aria-label="Language">
        <button id="lang-en" type="button" aria-pressed="true">English</button>
        <button id="lang-fi" type="button" aria-pressed="false">Suomi</button>
      </div>
      <div id="auth-signed-out">
        <input id="auth-email" type="email" data-i18n-ph="auth.email_ph" placeholder="grown-up@example.org" autocomplete="email">
        <button id="auth-send" type="button" data-i18n="auth.send">Send sign-in link</button>
        <button id="auth-test" type="button" data-i18n="auth.test" hidden>Use the test grown-up</button>
        <p id="auth-note" class="muted" data-i18n="auth.note">Grown-ups only: sign in with an email link.</p>
      </div>
      <div id="auth-signed-in" hidden>
        <span id="auth-who"></span>
        <button id="auth-out" type="button" data-i18n="auth.out">Sign out</button>
      </div>
    </div>
  </div>
</header>
<p id="app-error" class="error" hidden></p>

<main id="app" hidden>
  <section class="map-pane">
    <div id="map" aria-label="Map"></div>
    <div id="counts" class="counts"></div>
    <div class="filters">
      <label><span data-i18n="map.biome">Biome</span>
        <select id="filter-biome"></select>
      </label>
      <label><span data-i18n="map.state">Show</span>
        <select id="filter-state"></select>
      </label>
    </div>
  </section>

  <section class="side-pane">
    <article id="area-card" hidden>
      <h2 id="area-name"></h2>
      <p id="area-facts" class="muted"></p>
      <p id="area-state"></p>
      <button id="area-build" type="button" data-i18n="area.build">Build this place</button>
      <button id="area-wish" type="button" data-i18n="area.wish">I want this place!</button>
      <p id="area-msg" class="muted"></p>
    </article>

    <article id="drafts">
      <h2 data-i18n="drafts.title">Your drafts</h2>
      <div id="draft-list"></div>
    </article>
  </section>
</main>

<footer>
  <span data-i18n="app.credit">Map © OpenStreetMap contributors. Tiles © CARTO. Ecoregions: RESOLVE 2017.</span>
  <a href="/" data-i18n="app.play">Play Animundo</a>
</footer>
<script src="app.js"></script>
</body>
</html>
